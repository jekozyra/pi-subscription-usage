name: Bug report
description: Report incorrect behavior or a provider compatibility problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, account identifiers, raw authenticated responses, or unsanitized headers. Report security issues privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Provide a release tag or Git commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node.js version, and Pi version.
      placeholder: Ubuntu 24.04, Node.js 22.19.0, Pi 0.85.1
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options:
        - Codex
        - Claude
        - Both
        - Footer or lifecycle only
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction. Sanitize all provider data.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, account identifiers, raw authenticated responses, and unsanitized headers.
          required: true
